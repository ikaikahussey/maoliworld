version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/maoliworld
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - ACTIVITYPUB_PUBLIC_KEY=${ACTIVITYPUB_PUBLIC_KEY}
      - ACTIVITYPUB_PRIVATE_KEY=${ACTIVITYPUB_PRIVATE_KEY}
      - DEFAULT_FORUM_ID=${DEFAULT_FORUM_ID}
    depends_on:
      - db
    networks:
      - maoliworld

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=maoliworld
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maoliworld

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - maoliworld

volumes:
  postgres_data:

networks:
  maoliworld:
    driver: bridge 