version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/maoliworld
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - ACTIVITYPUB_PUBLIC_KEY=${ACTIVITYPUB_PUBLIC_KEY}
      - ACTIVITYPUB_PRIVATE_KEY=${ACTIVITYPUB_PRIVATE_KEY}
      - DEFAULT_FORUM_ID=${DEFAULT_FORUM_ID}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=maoliworld
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: 